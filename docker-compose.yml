services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: pnpm --filter @recoveryos/api start:prod
    environment:
      DATABASE_URL: postgresql://recoveryos:recoveryos@postgres:5432/recoveryos?schema=public
      REDIS_URL: redis://redis:6379
      SIMULATION_MODE: "true"
      RAZORPAY_WEBHOOK_SECRET: replace-me
    depends_on: [postgres, redis]
    ports: ["3001:3001"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on: [api]
    ports: ["3000:3000"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recoveryos
      POSTGRES_USER: recoveryos
      POSTGRES_PASSWORD: recoveryos
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
